<script>/* Sicherheitsnetz: js schaltet die Animationen ein. Meldet sich das Hauptskript kurz
   nach dem Laden nicht, wird js wieder entfernt, damit kein Inhalt unsichtbar bleibt. */
(function(){var d=document,w=window,h=d.documentElement;h.classList.add('js');
function pruefen(){if(!w.__animBereit){h.classList.remove('js');}}
w.addEventListener('load',function(){setTimeout(pruefen,800);},false);
setTimeout(pruefen,4000);})();</script>
</head>
<body>
<header class="top"><div class="top-in">
<a class="brand" href="/index.html" aria-label="mietblick, zur Startseite">
<img class="on-light" src="/assets/wortmarke-petrol.png" alt="mietblick" width="900" height="240">

</div>

</div>

<script>(function(){var b=document.querySelector('.burger'),m=document.getElementById('menu');if(!b||!m)return;
function setz(offen){b.setAttribute('aria-expanded',offen?'true':'false');b.setAttribute('aria-label',offen?'Menü schliessen':'Menü öffnen');if(offen){m.removeAttribute('hidden');}else{m.setAttribute('hidden','');}}
b.addEventListener('click',function(){setz(b.getAttribute('aria-expanded')!=='true');});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&b.getAttribute('aria-expanded')==='true'){setz(false);b.focus();}});
m.addEventListener('click',function(e){if(e.target.tagName==='A')setz(false);});})();</script>
<main class="shell narrow" style="padding:clamp(72px,12vw,140px) 24px;text-align:left">
<p class="eyebrow">Fehler 404</p>
<h1>Diese Seite gibt es nicht.</h1>
